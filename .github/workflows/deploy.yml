name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  # ─── BUILD FRONTEND ──────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: itsaffnco/saffnco_eventstock_frontend_app:latest
          build-args: |
            VITE_API_URL=https://servereventstock.saffnco.app
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ─── BUILD BACKEND ───────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: itsaffnco/saffnco_eventstock_backend_app:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # ─── DEPLOY ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # ─── NETWORK ─────────────────────────────────────────────────────
            docker network create eventstock_network 2>/dev/null || true

            # ─── FRONTEND ────────────────────────────────────────────────────
            docker stop eventstock_frontend 2>/dev/null || true
            docker rm   eventstock_frontend 2>/dev/null || true
            docker rmi  itsaffnco/saffnco_eventstock_frontend_app:latest 2>/dev/null || true

            docker pull itsaffnco/saffnco_eventstock_frontend_app:latest

            docker run -d \
              --name eventstock_frontend \
              --network eventstock_network \
              --restart unless-stopped \
              -p 3010:80 \
              itsaffnco/saffnco_eventstock_frontend_app:latest

            # ─── BACKEND ─────────────────────────────────────────────────────
            docker stop eventstock_backend 2>/dev/null || true
            docker rm   eventstock_backend 2>/dev/null || true
            docker rmi  itsaffnco/saffnco_eventstock_backend_app:latest 2>/dev/null || true

            docker pull itsaffnco/saffnco_eventstock_backend_app:latest

            # Write env file from secret
            {
              printf '%s' "${{ secrets.BACKEND_ENV }}" | while IFS= read -r line; do
                [[ -z "$line" || "$line" =~ ^# ]] && continue
                line=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                if [[ "$line" =~ ^([^=]+)=(.*)$ ]]; then
                  key="${BASH_REMATCH[1]}"
                  value="${BASH_REMATCH[2]}"
                  if [[ "$value" =~ [[:space:]] ]] && ! [[ "$value" =~ ^[\"\'] ]]; then
                    echo "${key}=\"${value}\""
                  else
                    echo "${key}=${value}"
                  fi
                fi
              done
            } > /tmp/eventstock_backend.env

            if [ ! -s /tmp/eventstock_backend.env ]; then
              echo "ERROR: BACKEND_ENV secret is empty or invalid"
              exit 1
            fi

            # Persistent storage directories
            mkdir -p /DATA/AppData/eventstock/storage/app/public
            mkdir -p /DATA/AppData/eventstock/storage/framework/sessions
            mkdir -p /DATA/AppData/eventstock/storage/framework/views
            mkdir -p /DATA/AppData/eventstock/storage/framework/cache/data
            mkdir -p /DATA/AppData/eventstock/storage/logs
            mkdir -p /DATA/AppData/eventstock/database
            touch /DATA/AppData/eventstock/database/database.sqlite

            docker run -d \
              --name eventstock_backend \
              --network eventstock_network \
              --restart unless-stopped \
              -p 3011:80 \
              --env-file /tmp/eventstock_backend.env \
              -v /DATA/AppData/eventstock/storage:/var/www/html/storage \
              -v /DATA/AppData/eventstock/database/database.sqlite:/var/www/html/database/database.sqlite \
              itsaffnco/saffnco_eventstock_backend_app:latest

            rm -f /tmp/eventstock_backend.env

            # ─── VERIFY ──────────────────────────────────────────────────────
            sleep 6

            if ! docker ps --format '{{.Names}}' | grep -q "^eventstock_frontend$"; then
              echo "ERROR: Frontend container failed to start"
              docker logs eventstock_frontend 2>/dev/null || true
              exit 1
            fi

            if ! docker ps --format '{{.Names}}' | grep -q "^eventstock_backend$"; then
              echo "ERROR: Backend container failed to start"
              docker logs eventstock_backend 2>/dev/null || true
              exit 1
            fi

            echo "Deployment successful!"
            echo "  Frontend : https://eventstock.saffnco.app"
            echo "  Backend  : https://servereventstock.saffnco.app"
